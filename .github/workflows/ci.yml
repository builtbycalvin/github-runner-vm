name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install shell test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh nftables
      - name: Test installer and commands
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n install.sh config/provision.sh
          sh -n bootstrap.sh
      - name: Check whitespace
        run: git diff --check
      - name: Validate Lima configuration without creating a VM
        if: runner.os == 'Linux'
        env:
          LIMA_HOME: ${{ runner.temp }}/lima-validation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lima-tools"
          curl --fail --location --max-time 120 \
            https://github.com/lima-vm/lima/releases/download/v2.2.0/lima-2.2.0-Linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/lima-tools/lima.tar.gz"
          printf '%s  %s\n' a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a "$RUNNER_TEMP/lima-tools/lima.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lima-tools/lima.tar.gz" -C "$RUNNER_TEMP/lima-tools"
          "$RUNNER_TEMP/lima-tools/bin/limactl" validate config/lima.yaml
      - name: Check nftables syntax without changing rules
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path('config/provision.sh').read_text()
          rules = source.split("<<'NFT'\n", 1)[1].split('\nNFT\n', 1)[0]
          (Path(os.environ['RUNNER_TEMP']) / 'ci-vm.nft').write_text(rules)
          PY
          sudo nft --check --file "$RUNNER_TEMP/ci-vm.nft"
